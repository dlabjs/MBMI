<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="경험에서 찾는 나의 전공 — 내가 해 온 일과 행동으로 전공의 단서를 찾는 진로 탐색 도구">
<meta property="og:title" content="MBMI · 경험에서 찾는 나의 전공">
<meta property="og:description" content="좋아하는 것과 잘하는 행동으로 살펴볼 전공·분야를 찾아봐요.">
<meta name="theme-color" content="#F2EFE9">
<title>MBMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@1,700;1,800&display=swap">
<style>
/* Layout: an editorial report on warm paper — heavy gothic headlines, italic serif numerals, burgundy accent, thin ink rules; one column, sticky bottom bar on phones */
:root{
  --bg:#F2EFE9; --surface:#FBF9F5; --ink:#171615; --muted:#6C665E; --line:#DBD4C9;
  --accent:#981B2E; --accent-soft:#F2E3E1; --accent-ink:#FFFFFF;
  --q-main:#171615; --main-ink:#FBF9F5; --q-try:#2B4B9B; --try-ink:#FFFFFF; --q-hidden:#946110; --q-rest:#8A847A; --warn:#B0431A;
  --font-display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Playfair Display",Georgia,"Times New Roman",serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1C1A18; --ink:#EEE9E1; --muted:#A39B90; --line:#35312C;
  --accent:#D9A35A; --accent-soft:#352A1C; --accent-ink:#141312;
  --q-main:#EEE9E1; --main-ink:#141312; --q-try:#7F9CE6; --try-ink:#141312; --q-hidden:#C98E78; --q-rest:#8A847A; --warn:#E07A5F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1C1A18; --ink:#EEE9E1; --muted:#A39B90; --line:#35312C;
  --accent:#D9A35A; --accent-soft:#352A1C; --accent-ink:#141312;
  --q-main:#EEE9E1; --main-ink:#141312; --q-try:#7F9CE6; --try-ink:#141312; --q-hidden:#C98E78; --q-rest:#8A847A; --warn:#E07A5F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.28;letter-spacing:-.02em}
h1{font-size:32px;font-weight:900}
h1 em,h2 em{font-style:normal;color:var(--accent)}
h2{font-size:21px;font-weight:900;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.row.between>h2{border-bottom:0;padding-bottom:0}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--font-display);font-size:24px;font-weight:900;letter-spacing:-.01em}
.brand .small{color:var(--accent);font-weight:700}
.rail{display:flex;gap:4px;flex-wrap:wrap}
.rail span{font-size:12px;padding:3px 9px;border-radius:var(--r);border:1px solid var(--line);color:var(--muted);font-weight:500}
.rail span.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.rail span.done{color:var(--ink);border-color:var(--ink)}
.railm{display:none;font-size:13px;font-weight:700;align-items:baseline;gap:6px}
.railm i{font-family:var(--font-num);font-style:italic;font-size:18px;color:var(--accent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:16px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
button{font:inherit;cursor:pointer;border-radius:var(--r);padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.qnum{font-family:var(--font-num);font-style:italic;font-size:30px;line-height:1;color:var(--accent);font-weight:800}
.qtext{font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.hint{background:var(--bg);border-left:3px solid var(--ink);padding:12px 14px;font-size:14px}
.hint ul{margin:6px 0 0;padding-left:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:14px}
.seg button.sel{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.progress{height:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{padding:10px 14px;border-radius:6px;max-width:88%;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent-soft)}
.bubble.ai{align-self:flex-start;border:1px solid var(--line)}
.myanswer{background:var(--bg);border-left:3px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.myanswer p{white-space:pre-wrap;font-weight:700;font-size:16px}
.ask{font-size:16px;font-weight:700;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;min-height:36px}
.chip.sel{border-color:var(--ink);background:var(--ink);color:var(--surface);font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:340px){.vgrid{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:8px}
.vopt{text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-width:0}
.vopt b{font-weight:700}
.vopt small{color:var(--muted);font-size:12px;line-height:1.45}
.vopt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.verbcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.verbcard input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.family{display:flex;flex-direction:column;gap:6px}
.fam-name{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.rate{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rate:first-child{border-top:0;padding-top:0}
.rate .q{font-size:13px;color:var(--muted);min-width:44px}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:1fr 1fr auto;gap:6px}
.axis-y{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);text-align:center;letter-spacing:.08em;font-weight:700}
.axis-x{grid-column:2/4;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.08em;font-weight:700}
.cell{border-radius:var(--r);padding:14px;min-height:120px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);min-width:0;background:var(--surface)}
.cell h4{margin:0;font-size:15px;font-weight:900}
.cell p{font-size:12px;color:var(--muted);line-height:1.5}
.cell .chips .chip{cursor:default;font-size:13px;padding:3px 9px;min-height:0}
.c-main{background:var(--q-main);border-color:var(--q-main);color:var(--main-ink)}
.c-main h4,.c-main p{color:var(--main-ink)}.c-main p{opacity:.75}
.c-main .chip,.c-try .chip{background:transparent;color:inherit;border-color:currentColor}
.c-try{background:var(--q-try);border-color:var(--q-try);color:var(--try-ink)}
.c-try h4,.c-try p{color:var(--try-ink)}.c-try p{opacity:.8}
.c-hidden{background:var(--bg)}.c-hidden h4{color:var(--q-hidden)}.c-rest h4{color:var(--q-rest)}
.field{border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.field-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.field-head h3{font-weight:900;font-size:18px}
.tag{font-size:12px;padding:1px 8px;border-radius:var(--r);border:1px solid currentColor;white-space:nowrap;font-weight:600}
.tag.m-확립{color:var(--muted)}.tag.m-성장{color:var(--q-try)}.tag.m-초기{color:var(--q-hidden)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:5px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;min-width:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;font-size:14px;background:var(--bg)}
.note{border-left:3px solid var(--accent);padding:8px 12px;font-size:14px;background:var(--bg)}
.teacher{border:1.5px solid var(--ink);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.teacher ul{margin:0;padding-left:18px}
.thinking{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.thinking::after{content:"…";animation:d 1.2s steps(3) infinite}@keyframes d{0%{content:"."}50%{content:".."}100%{content:"..."}}}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;min-height:48px}
.fitem b{font-weight:600}
.fitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.fitem.sel b{font-weight:700}
.fcheck{width:22px;height:22px;flex:none;border-radius:3px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--accent-ink)}
.fitem.sel .fcheck{border-color:var(--accent);background:var(--accent)}
.fbody{display:flex;flex-direction:column;min-width:0}
.fbody small{color:var(--muted);font-size:12px}
.star{color:var(--q-hidden)}
.why{background:var(--bg);padding:10px 12px;border-radius:var(--r)}
.why ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.why li{margin-bottom:2px}
.subjlist{display:flex;flex-direction:column}
.subjrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.subjrow b{font-weight:700}
.subjrow:last-child{border-bottom:0}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{padding:8px 0;font-family:var(--font-num);font-style:italic;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.frate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.frate .seg button{padding:5px 10px;font-size:13px;min-height:34px}
textarea.code{min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats>div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--font-num);font-style:italic;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.hist{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;height:140px;align-items:end;margin-top:8px}
.hcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.hcol i{display:block;width:100%;background:var(--accent);min-height:1px}
.hc,.hl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--ink)}
td.num,th:not(:first-child){font-variant-numeric:tabular-nums}
.run{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.run+.run{margin-top:6px}
.runhead{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:0}
.runscore{font-family:var(--font-num);font-style:italic;font-size:24px;font-weight:800;min-width:34px;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.runmeta{display:flex;flex-direction:column;min-width:0}
.runmeta small{color:var(--muted);font-size:12px}
.rundetail{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rundetail ul{margin:0;padding-left:18px}
button.danger{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.icard{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;min-width:0;position:relative}
.icard b{font-weight:700}
.icard small{color:var(--muted);font-size:12px;line-height:1.4}
.icard.sel{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.icard.sel small{color:var(--surface);opacity:.75}
.icard.top{background:var(--accent);border-color:var(--accent)}
.itop{font-size:11px;font-weight:900;margin-top:4px;letter-spacing:.04em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;padding:10px 12px;background:var(--bg);border-radius:var(--r);cursor:pointer}.consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.rank{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px;vertical-align:middle}.rank i{font-family:var(--font-num);font-style:italic;font-size:20px;font-weight:800;margin-right:1px}
.navsheet{position:sticky;bottom:0;z-index:5;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));gap:6px;box-shadow:0 -8px 20px -12px rgba(0,0,0,.25)}
.navsheet .row.between{flex-wrap:nowrap}
.navsheet .row.between>.row{flex:1;justify-content:flex-end}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:640px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){
  body{font-size:16px;padding-block:12px 24px}
  .wrap{gap:12px}
  .sheet{padding:18px 16px;gap:14px}
  h1{font-size:27px}
  h2{font-size:19px}
  .qtext{font-size:18px}
  .rail{display:none}.railm{display:flex}
  header.top{flex-wrap:nowrap}
  .brand{flex-direction:column;gap:0}
  .brand b{font-size:22px}
  .brand .small{font-size:12px}
  .cols{grid-template-columns:1fr}
  .matrix{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .axis-y,.axis-x{display:none}
  .cell{min-height:0;padding:12px}
  .kv{grid-template-columns:76px 1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scale{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .scale button{min-height:44px}
  .vopt{padding:9px 10px}
  .vopt small{font-size:11.5px}
  .fitem{min-height:50px}
  .navsheet{margin-inline:-4px;border-radius:6px 6px 0 0}
  .navsheet button{min-height:48px}
  .navsheet .row.between>.row>button{flex:1}
  .subjrow{flex-wrap:wrap}
  .frate{flex-direction:column;align-items:flex-start}
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ===================== 데이터 (2026 초안) ===================== */
const DATA_VERSION = "2026년 10월 초안";

const FAMILIES = [
  {id:"A", name:"분석"}, {id:"M", name:"만들기"}, {id:"P", name:"사람"},
  {id:"E", name:"표현"}, {id:"O", name:"조직"}, {id:"R", name:"탐구"}
];

const VERBS = [
  {id:"pattern", f:"A", name:"패턴 찾기", d:"여러 사례에서 반복되는 규칙이나 공통점을 알아차리기", ex:"게임 상대의 습관을 읽어낸다 / 문제 유형이 금방 보인다"},
  {id:"abstract", f:"A", name:"핵심 추리기", d:"복잡한 것을 핵심만 남겨 단순한 구조로 정리하기", ex:"긴 단원을 한 장으로 정리한다 / 친구에게 요점만 설명한다"},
  {id:"calc", f:"A", name:"정확하게 계산하기", d:"숫자와 양을 실수 없이 다루고 따지기", ex:"용돈·확률을 계산해 본다 / 게임 스탯을 숫자로 비교한다"},
  {id:"evidence", f:"A", name:"근거 따지기", d:"주장이 맞는지 증거와 논리로 확인하기", ex:"뉴스가 사실인지 확인한다 / 토론에서 허점을 찾는다"},
  {id:"code", f:"M", name:"작동하는 규칙 만들기", d:"절차와 규칙을 설계해 무언가가 스스로 돌아가게 만들기", ex:"마인크래프트 회로를 짠다 / 반복 작업을 자동화한다"},
  {id:"build", f:"M", name:"손으로 만들기", d:"재료와 부품으로 실제 물건을 조립하고 완성하기", ex:"레고·프라모델을 만든다 / 고장 난 물건을 분해해 본다"},
  {id:"design", f:"M", name:"보기 좋게 디자인하기", d:"쓰기 편하고 보기 좋은 모양과 배치를 고르기", ex:"발표 자료를 깔끔하게 꾸민다 / 방 배치를 바꾼다"},

  const turns = (a.turns||[]).filter(t=>t.a).map((t,i)=>`꼬리질문${i+1}: ${t.q}\n학생 답${i+1}: ${t.a}`).join("\n");
  const force = (a.turns||[]).length>=2;
  return `너는 한국 중고등학생의 전공 탐색을 돕는 인터뷰어야. 학생이 자기 경험 하나를 답했어. 목표는 그 경험 속 학생의 '구체적인 행동'을 찾는 거야.

[질문 종류] ${KIND_LABEL[q.kind]} (${q.tag})
[질문] ${a.alt?q.alt:q.main}
[학생 답] ${chosenText(qid)}
${(()=>{ const o=optSet(qid).opts; const m=(a.opts||[]).map(i=>o[i]?.[0]).filter(Boolean); return (m.length?`[학생이 고른 것] ${m.join(", ")}\n`:"")+(a.freeText?`[학생이 적은 가장 좋은 순간] ${a.freeText}\n`:""); })()}
${a.keep?`[계속 하고 싶은지] ${a.keep}\n`:""}${turns?turns+"\n":""}
[행동 사전] (id: 이름 - 설명)
${VERB_LIST_TEXT}

규칙:
${force?"- 이미 꼬리질문을 2번 했으니 반드시 행동을 골라.":"- 학생 답만으로 학생이 '정확히 무엇을 했는지' 알기 어려우면 꼬리질문 하나를 해. 예: '게임' → 그 게임에서 제일 재밌는 순간이 언제인지, 공략을 직접 짜는지 따라 하는지.\n- 충분히 구체적이면 꼬리질문 없이 행동을 골라."}
- 꼬리질문은 친근한 반말 한 문장, 열린 질문. 평가하거나 칭찬하지 마.
- 행동은 사전의 id 중에서 2~3개, 학생 답에 근거가 있는 것만. why는 학생이 쓴 말을 짧게 인용하며 반말 한 문장으로.
- 학생 답이 장난이거나 의미 없으면 꼬리질문으로 구체적인 경험을 다시 물어봐.

오직 JSON 하나만 답해:
{"type":"ask","question":"..."}
또는
{"type":"verbs","verbs":[{"id":"pattern","why":"..."}]}`;
}
async function runAI(qid){
  if(!sample || busy) return;
  busy = true; aiMsg = ""; render();
  const a = ans(qid);
  try{
    const res = await sample.json(buildPrompt(qid), {modelTier:"quick", cache:false});
    if(res && res.type==="ask" && res.question && a.turns.length<2){
      a.turns.push({q:String(res.question), a:""});
    }else if(res && Array.isArray(res.verbs)){
      const vs = res.verbs.filter(v=>v && VERB[v.id]).slice(0,3);
      if(vs.length){ a.custom = true; a.picks = vs.map(v=>v.id); a.why = Object.fromEntries(vs.map(v=>[v.id,String(v.why||"")])); a.turns = a.turns.filter(t=>t.a); }
      else aiMsg = "AI가 행동을 찾지 못했어. 아래 목록에서 직접 골라줘.";
    }else aiMsg = "AI 응답을 읽지 못했어. 아래 목록에서 직접 골라줘.";
  }catch(e){
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ aiState="off"; aiMsg="AI를 쓸 수 없는 환경이라 목록에서 직접 골라줘."; }
    else if(e.code==="rate_limited") aiMsg="AI 요청이 너무 많아. 잠시 뒤 다시 누르거나 직접 골라줘.";
    else if(e.code!=="cancelled") aiMsg="AI 연결이 잠깐 끊겼어. 다시 누르거나 직접 골라줘.";
  }finally{ busy=false; save(); render(); }
}

// 코드로 보내기: 압축해서 짧게 (안 되면 그대로)
const b64 = bytes => { let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64 = str => { str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const s=atob(str); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function encodeRun(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  try{ if(typeof CompressionStream!=="undefined"){ const cs=new CompressionStream("deflate-raw"); const buf=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer(); return "MBMI1z."+b64(new Uint8Array(buf)); } }catch(e){}
  return "MBMI1j."+b64(raw);
}
async function decodeRun(code){
  code = code.trim().replace(/\s+/g,"");
  const m = code.match(/^MBMI1([zj])\.(.+)$/); if(!m) throw new Error("코드 형식이 아니에요");
  let bytes = unb64(m[2]);
  if(m[1]==="z"){ const ds=new DecompressionStream("deflate-raw"); bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer()); }
  const obj = JSON.parse(new TextDecoder().decode(bytes)); if(!obj || !obj.id || obj.score==null) throw new Error("내용이 비어 있어요"); return obj;
}
let sendState = {status:"", code:""}; // status: sending | sent | code | error
async function submitRun(){
  if(S.score==null || !S.consent) return;
  if(!SUBMIT_URL){ sendState = {status:"error", msg:"아직 결과를 받을 곳이 연결되지 않았어. 선생님께 알려줘."}; render(); return; }
  S.runId ||= newId(); save();
  const payload = buildPayload();
  sendState = {status:"sending"}; render();
  const body = JSON.stringify(payload);
  try{
    const res = await fetch(SUBMIT_URL, {method:"POST", body}); // text/plain으로 보내 사전 요청 없이 전송
    const j = await res.json().catch(()=>({ok:res.ok}));
    if(!j.ok) throw new Error(j.error||"server");
    sendState = {status:"sent"};
  }catch(e){
    try{ await fetch(SUBMIT_URL, {method:"POST", mode:"no-cors", body}); sendState = {status:"sent"}; } // 응답을 못 읽는 환경 대비
    catch(e2){ sendState = {status:"error", msg:"보내지 못했어. 인터넷 연결을 확인하고 다시 눌러줘."}; }
  }
  if(sendState.status==="sent"){ S.sentAt = payload.t; save(); }
  render();
}

let T = {loading:false, runs:[], err:"", open:null, importMsg:"", confirmDel:null};
async function loadRuns(){
  if(!db){ T.err="이 화면에서는 저장소에 연결할 수 없어요."; render(); return; }
  T.loading = true; T.err=""; render();
  try{
    const out = [];
    const a = await db.collection("runs").limit(1000).get();
    a.docs.forEach(d=>{ const x=d.data(); if(x) out.push({...x, _src:"runs", _doc:d.id}); });
    const b = await db.collection("results").limit(1000).get();
    b.docs.forEach(d=>{ const x=d.data(); (x&&Array.isArray(x.runs)?x.runs:[]).forEach(r=>out.push({...r, _src:"results", _doc:d.id})); });
    T.runs = out.sort((x,y)=>String(y.t).localeCompare(String(x.t)));
  }catch(e){ T.err = "불러오지 못했어요 ("+(e.code||"error")+"). 잠시 뒤 새로고침을 눌러 주세요."; }
  T.loading = false; render();
}
async function deleteRun(r){
  try{
    if(r._src==="runs") await db.doc("runs/"+r._doc).delete();
    else { const ref=db.doc("results/"+r._doc); const snap=await ref.get(); const runs=(snap.data()?.runs||[]).filter(x=>x.id!==r.id); await ref.set({runs}); }
    T.confirmDel=null; await loadRuns();
  }catch(e){ T.err="지우지 못했어요 ("+(e.code||"error")+")."; render(); }
}
async function importCodes(text){
  const codes = text.split(/\s+/).filter(c=>c.startsWith("MBMI1"));
  if(!codes.length){ T.importMsg="붙여 넣은 내용에서 코드를 찾지 못했어요."; render(); return; }
  let ok=0, bad=0;
  for(const c of codes){ try{ const r=await decodeRun(c); await db.doc("runs/"+r.id).set({...r, via:"code"}); ok++; }catch(e){ bad++; } }
  T.importMsg = `${ok}개를 저장했어요.${bad?` ${bad}개는 읽지 못했어요.`:""}`; await loadRuns();
}
const avg = a => a.length? a.reduce((s,x)=>s+x,0)/a.length : null;
const fmt = x => x==null? "–" : x.toFixed(1);
const FIELD = Object.fromEntries(FIELDS.map(f=>[f.id,f]));
function adultStats(runs){
  const A = runs.filter(r=>r.role && r.role!=="student" && r.actual && (r.actual.fields||[]).some(f=>f!=="none"));
  const sat = A.filter(r=>Number(r.actual.satisfaction)>=7), unsat = A.filter(r=>Number(r.actual.satisfaction)<=4);
  const hit = r => (r.actual.fields||[]).some(f=>(r.result?.fields||[]).includes(f));
  const bestRank = r => Math.min(...(r.actual.fields||[]).filter(f=>r.rankOf?.[f]).map(f=>r.rankOf[f]), 99);
  const pct = (arr,fn) => arr.length? Math.round(arr.filter(fn).length/arr.length*100) : null;
  const shownAvg = avg(A.map(r=>(r.result?.fields||[]).length)) || 0;
  const chance = Math.round(shownAvg/FIELDS.length*100);
  const top5 = r => bestRank(r)<=5;
  // 만족한 사람들이 실제로 남긴 행동 → 분야별 행동표의 근거
  const byField = {};
  sat.forEach(r=>(r.actual.fields||[]).forEach(f=>{ if(f==="none") return; const e=(byField[f] ||= {n:0, like:{}, good:{}}); e.n++;
    (r.keepLike||[]).forEach(v=>e.like[v]=(e.like[v]||0)+1); (r.keepGood||[]).forEach(v=>e.good[v]=(e.good[v]||0)+1); }));
  return {n:A.length, sat, unsat, hitSat:pct(sat,hit), top5Sat:pct(sat,top5), missUnsat:pct(unsat,r=>!hit(r)), chance, byField, medRank: sat.length? sat.map(bestRank).sort((a,b)=>a-b)[Math.floor(sat.length/2)] : null};
}
function stats(runs){
  runs = runs.filter(r=>!r.role || r.role==="student");
  const sc = runs.map(r=>Number(r.score)).filter(x=>!isNaN(x));
  const hist = Array.from({length:11},(_,i)=>sc.filter(x=>x===i).length);
  const byV = {}; runs.forEach(r=>{ (byV[r.v||"?"] ||= []).push(Number(r.score)); });
  const fs = {}; runs.forEach(r=>{ (r.result?.fields||[]).forEach(f=>{ const e=(fs[f] ||= {shown:0, rate:[], overall:[]}); e.shown++; e.overall.push(Number(r.score)); const fr=r.fieldRatings?.[f]; if(fr!=null) e.rate.push(Number(fr)); }); });
  const qs = {}; runs.forEach(r=>{ for(const [qid,a] of Object.entries(r.answers||{})){ const e=(qs[qid] ||= {n:0, rest:0, custom:0, ai:0, opts:{}}); e.n++; if(a.rest) e.rest++; if(a.custom) e.custom++; if(a.ai) e.ai++; (a.opts||[]).forEach(o=>e.opts[o]=(e.opts[o]||0)+1); } });
  const noCard = {}; runs.forEach(r=>{ for(const [qid,a] of Object.entries(r.answers||{})){ if(a.rest||!a.kept) continue; if((qid==="q1" && !a.activity) || a.custom){ const k=a.kept.trim(); const e=(noCard[k] ||= {n:0, q:new Set(), free:[]}); e.n++; e.q.add(Q[qid]?.tag||qid); if(a.freeText) e.free.push(a.freeText); } } });
  const match=[], miss=[]; runs.forEach(r=>{ const rf=r.result?.fields||[]; const top=intFields(r.interestTop?.length?r.interestTop:(r.interests||[])); if(!rf.length||!top.size) return; (rf.some(f=>top.has(f))?match:miss).push(Number(r.score)); });
  return {n:runs.length, avg:avg(sc), hist, byV, fs, qs, match, miss, noCard};
}

      Object.entries(r.fieldRatings||{}).map(([f,v])=>`${f}:${v}`).join("|"),Object.keys(s).filter(k=>s[k]==="like").join("|"),Object.keys(s).filter(k=>s[k]==="dislike").join("|"),(r.subjGood||[]).join("|"),Object.values(r.subjParts||{}).flat().join("|"),Object.values(r.subjPartsOk||{}).flat().join("|"),
      ...qids.flatMap(q=>{ const x=a[q]||{}; return [(x.items||[]).join("|"),x.kept||"",(x.opts||[]).join("|"),x.rest?1:0,x.custom?1:0,(x.picks||[]).join("|")]; })].map(cell).join(","); });
  return "﻿"+[head.join(","),...rows].join("\n");
}

const STEPS_BASE = [["intro","시작"],["q","질문"],["subj","교과"],["like","덜어내기 1"],["good","덜어내기 2"],["result","결과"]];

function rail(){

}

function viewQ(){

function updateNav(){
  if(S.step!=="q") return;

    <h2>덜어내기 1 · 좋아하는 행동만 남기기</h2>

  </section>`;
}

    <p class="muted">이 답은 결과 계산에는 쓰지 않아. 결과가 실제 전공·일과 맞는지 비교하는 데만 써.</p>
    <label class="family"><span class="label">${S.role==="college"?"지금 전공":"지금 하는 일 (또는 마지막 전공)"}</span>
      <input type="text" id="actualText" data-bind="actualText" value="${esc(S.actualText)}" placeholder="${S.role==="college"?"예: 통계학과":"예: 중학교 수학 교사"}"></label>
    <div class="family"><p class="ask">아래 분야 중 가장 가까운 것을 골라줘. (2개까지)</p>
      <span class="label">잘 알려진 분야</span><div class="chips">${known.map(chip).join("")}</div>
      <span class="label">점점 떠오르는 분야</span><div class="chips">${em.map(chip).join("")}</div>
      <div class="chips"><button class="chip ${S.actualFields.includes("none")?"sel":""}" data-act="actual" data-f="none">딱 맞는 게 없어</button></div></div>
    <div class="family"><p class="ask">지금 ${S.role==="college"?"전공":"일"}에 얼마나 만족해?</p>
      <div class="scale">${Array.from({length:11},(_,i)=>`<button class="${S.satisfaction===i?"sel":""}" data-act="sat" data-v="${i}">${i}</button>`).join("")}</div>
      <div class="scale-lab"><span>0 전혀</span><span>5 보통</span><span>10 아주 만족</span></div></div>
    <div class="family"><p class="ask">다시 고를 수 있다면 같은 ${S.role==="college"?"전공":"일"}을 고를 거야?</p>
      <div class="seg">${["응","아니","모르겠어"].map(k=>`<button class="${S.sameAgain===k?"sel":""}" data-act="same" data-v="${k}">${k}</button>`).join("")}</div></div>
    <div class="row between"><button data-act="backGood">이전</button><button class="primary" data-act="meDone" ${S.actualFields.length&&S.satisfaction!=null?"":"disabled"}>결과 보기</button></div>
  </section>`;
}
function viewGood(){
  const n = Object.keys(collected()).length, max = keepMax(n);

    <h2>덜어내기 2 · 잘하는 행동만 남기기</h2>
    <p>같은 목록이야. 이번에는 <b>남보다 쉽게 되거나 잘한다는 말을 듣는 행동</b>만 남겨줘. 많아야 ${max}개야. 꼭 ${max}개를 채우지 않아도 돼.</p>
    <p class="small muted">좋아하는지는 생각하지 마. 1번에서 남긴 것과 같아도, 달라도 괜찮아.</p>
    ${funnelList("keepGood", max)}
    <p class="small muted">${S.keepGood.length}개 남김 (최대 ${max}개)</p>

function viewResult(){
  const P = profile(); const ids = Object.keys(P);
  const quad = {main:[],try:[],hidden:[],rest:[]};
  ids.forEach(id=>quad[quadrant(P[id])].push(id));
  const drainVerbs = ids.filter(id=>P[id].drain);
  const chips = list=> list.length? `<div class="chips">${list.map(id=>`<span class="chip">${esc(VERB[id].name)}</span>`).join("")}</div>` : `<p>아직 없음</p>`;
  const known = rankFields(P,"known"), emerging = rankFields(P,"emerging");
  const fieldCard = (x, i)=>{
    const f = x.f;
    return `<article class="field">
      <div class="field-head"><h3><span class="rank"><i>${i===0?1:2}</i>순위</span> ${esc(f.name)}</h3>${f.maturity?`<span class="tag m-${f.maturity}">${f.maturity==="확립"?"이미 자리 잡음":f.maturity==="성장"?"성장 중":"초기 단계"}</span>`:""}</div>
      <div class="why"><span class="label">이 분야가 나온 이유</span><ul>${x.hits.map(v=>`<li><b>${esc(VERB[v].name)}</b> ← ${evidence(P,v).map(esc).join(" / ")}</li>`).join("")}</ul></div>
      ${x.inTop?`<p class="small" style="color:var(--q-try)">처음에 가장 끌린다고 고른 분야와 이어져 있어.</p>`:x.inChecked?`<p class="small" style="color:var(--q-try)">처음에 관심 있다고 체크한 분야와 이어져 있어.</p>`:""}${x.topic?`<p class="small" style="color:var(--q-try)">네가 즐겨 보는 주제와도 겹치는 분야야.</p>`:""}
      <dl class="kv">
        ${x.drain.length?`<dt>주의</dt><dd style="color:var(--warn)">하고 나면 지친다고 한 ${x.drain.map(v=>esc(VERB[v].name)).join(", ")}도 자주 써야 해</dd>`:""}
        ${f.why?`<dt>왜 떠오르나</dt><dd>${esc(f.why)}</dd>`:""}
        <dt>들어가는 길</dt><dd>${f.routes.map(esc).join(" · ")}</dd>
        <dt>선택과목</dt><dd>${(()=>{ const pSub=new Set(x.partHit.flatMap(id=>PART[id].subjects)); const list=[...new Set([...[...pSub].filter(sb=>!f.subjects.includes(sb)).slice(0,1), ...f.subjects])].sort((a,b)=>(pSub.has(b)?1:0)-(pSub.has(a)?1:0));
          return list.map(sb=>{ const k=schoolOf(sb), m=k&&S.subj[k]; return pSub.has(sb)||m==="like"?`<b>${esc(sb)} ♥</b>`:m==="dislike"?`<span style="color:var(--warn)">${esc(sb)}</span>`:esc(sb); }).join(" · "); })()}
          ${x.partHit.length?`<br><span class="small" style="color:var(--q-try)">네가 좋다고 한 ${x.partHit.map(id=>PART[id].name).join(", ")}과(와) 이어지는 분야야.</span>`:""}${x.okHit.length?`<br><span class="small" style="color:var(--q-try)">${x.okSaved.join(", ")||"그 과목"}은(는) 싫다고 했지만 ${x.okHit.map(id=>PART[id].name).join(", ")}은(는) 괜찮다고 했어. 과목 전체보다 이 부분을 기준으로 보자.</span>`:""}
          ${x.dislikeS.length?`<br><span class="small" style="color:var(--warn)">싫다고 한 ${x.dislikeS.join(", ")} 과목과 이어져 있어. 그래도 행동이 맞는다면 과목보다 하는 일이 중요한지 생각해 봐.</span>`:""}</dd>
        <dt>해볼 실험</dt><dd>${esc(f.tryit)}</dd>
      </dl>${fieldRateRow(f.id)}</article>`;
  };
  // 처음 고른 분야 vs 행동이 가리키는 분야
  const resultIds = [...known,...emerging].map(x=>x.f.id);
  const topNames = S.interestTop.length? S.interestTop : S.interests;
  const topF = intFields(topNames), chkF = intFields(S.interests.filter(i=>!topNames.includes(i)));
  const hitTop = resultIds.filter(f=>topF.has(f)), hitChk = resultIds.filter(f=>!topF.has(f) && chkF.has(f));
  const iName = ids => ids.map(i=>INT[i].name).join(", ");
  const fName = ids => ids.map(f=>FIELD[f].name).join(", ");
  let selfMsg = "";
  if(!resultIds.length) selfMsg = `<p class="muted">행동과 맞는 분야가 아직 나오지 않아서 비교하기 어려워.</p>`;
  else if(hitTop.length) selfMsg = `<p class="note">처음에 가장 끌린다고 고른 <b>${iName(topNames)}</b>와(과) 네 행동이 가리키는 <b>${fName(hitTop)}</b>이(가) 같은 방향이야.</p>`;
  else selfMsg = `<p class="warnbox">처음에 가장 끌린다고 고른 건 <b>${iName(topNames)}</b>였는데, 네 행동이 가리키는 분야는 <b>${fName(resultIds)}</b>이야. 그 분야에서 실제로 매일 하는 일이 네가 좋아하는 행동과 맞는지 선생님과 이야기해 보자.</p>`;
  if(isAdult() && S.actualFields.length){ const real=S.actualFields.filter(f=>f!=="none"); const all=[...scoreFields(P)].sort((a,b)=>b.score-a.score).map(x=>x.f.id);
    const best = real.map(f=>all.indexOf(f)+1).filter(n=>n>0).sort((a,b)=>a-b)[0];
    selfMsg += real.length? `<p class="note">지금 ${S.role==="college"?"전공":"일"}과 가까운 <b>${esc(fName(real))}</b>은(는) 행동 기준으로 ${FIELDS.length}개 분야 중 <b>${best}위</b>야.</p>` : ""; }
  if(hitChk.length) selfMsg += `<p class="note">처음에 관심 있다고 체크만 했던 분야 중 <b>${fName(hitChk)}</b>은(는) 네 행동과도 이어져 있어. 생각보다 더 맞을 수 있으니 눈여겨봐.</p>`;
  // 희망 전공 비교
  const hv = S.hopeVerbs; let check = "";
  if(S.hope.trim()){
    const inMain = hv.filter(v=>quad.main.includes(v)), inTry = hv.filter(v=>quad.try.includes(v));
    const inDrain = hv.filter(v=>drainVerbs.includes(v)), unknown = hv.filter(v=>!ids.includes(v));
    let msg = "";
    if(hv.length){
      if(inDrain.length) msg += `<p class="warnbox">이 전공에서 매일 할 것 같은 <b>${inDrain.map(v=>VERB[v].name).join(", ")}</b>은(는) 네가 하고 나면 지친다고 한 행동이야. 이 전공을 고른 이유가 무엇이었는지 선생님과 이야기해 보자.</p>`;
      if(inMain.length) msg += `<p class="note"><b>${inMain.map(v=>VERB[v].name).join(", ")}</b>은(는) 네가 좋아하고 잘하는 행동과 겹쳐. 지금 희망과 탐색 결과가 같은 방향을 가리키고 있어.</p>`;
      if(!inMain.length && !inDrain.length && inTry.length) msg += `<p class="note"><b>${inTry.map(v=>VERB[v].name).join(", ")}</b>은(는) 좋아하지만 아직 키워야 하는 행동이야. 실력을 키울 계획이 있는지 확인해 보자.</p>`;
      if(!inMain.length && !inTry.length && !inDrain.length) msg += `<p class="warnbox">고른 행동이 이번 탐색에서 나온 행동과 거의 겹치지 않아. 이 전공을 생각한 이유가 전망이나 주변 기대 때문인지 한번 따져보자.</p>`;
      if(unknown.length) msg += `<p class="small muted">${unknown.map(v=>VERB[v].name).join(", ")}은(는) 이번에 답한 내용에서 나오지 않은 행동이야. 직접 해본 적이 있는지 떠올려 봐.</p>`;
    }
    check = `<section class="sheet">
      <h2>처음 적은 희망과 비교하기</h2>
      <p>처음에 적은 희망 전공·진로는 <b>${esc(S.hope)}</b>였어. 그 일을 하는 사람이 매일 가장 많이 할 것 같은 행동을 3개까지 골라 봐.</p>
      <div style="display:flex;flex-direction:column;gap:14px">${verbPicker(hv,"hopeV",3)}</div>
      ${msg}
    </section>`;
  }
  const others = QUESTIONS.filter(done).flatMap(q=>{ const a=S.answers[q.id]; const ct=chosenText(q.id);
    const rest = filled(a).map(i=>a.items[i].trim()).filter(t=>t!==ct); return rest.length? [`Q${QUESTIONS.indexOf(q)+1} ${q.tag}: ${rest.join(", ")} (남긴 것: ${ct})`] : []; });
  const TI = topicInfo();
  const SL = SUBJECTS.filter(k=>S.subj[k]==="like"), SD = SUBJECTS.filter(k=>S.subj[k]==="dislike"), SG = S.subjGood;
  const sBoth = SL.filter(k=>SG.includes(k)), sTry = SL.filter(k=>!SG.includes(k)), sHidden = SG.filter(k=>!SL.includes(k)), sHate = SG.filter(k=>SD.includes(k));
  const subjSection = (SL.length||SD.length||SG.length)? `<section class="sheet">
      <h2>교과로 본 나</h2>
      <dl class="kv">
        <dt>좋고 잘 나옴</dt><dd>${sBoth.join(", ")||"없음"}</dd>
        <dt>좋지만 아직</dt><dd>${sTry.join(", ")||"없음"}</dd>
        <dt>잘 나오지만 안 끌림</dt><dd>${sHidden.join(", ")||"없음"}</dd>
      </dl>
      ${sHate.length?`<p class="note"><b>${sHate.join(", ")}</b>은(는) 성적은 잘 나오는데 싫다고 했어. 그 과목을 전공으로 고를 필요는 없어. 그 과목에서 쓰는 능력은 다른 분야에서도 쓰이니까, 위의 행동 결과에서 어디로 옮겨 갈 수 있는지 찾아보자.</p>`:""}
    </section>` : "";
  const talk = [];
  if(sHate.length) talk.push(`성적은 잘 나오지만 싫은 과목 <b>${sHate.join(", ")}</b>: 과목 이름 대신 그 과목에서 쓰는 능력으로 진로를 넓혀 보기`);
  if(resultIds.length && !hitTop.length) talk.push(`가장 끌린다고 한 분야(${esc(iName(topNames))})와 행동이 가리키는 분야가 다름: 그 분야를 고른 이유가 하는 일 때문인지, 이름이나 전망 때문인지 물어보기`);
  if(S.interests.length>=8) talk.push(`관심 분야를 ${S.interests.length}개 고름: 아직 넓게 탐색 중인지, 고르기가 어려웠는지 확인하기`);
  if(quad.hidden.length) talk.push(`숨은 재능 <b>${quad.hidden.map(v=>VERB[v].name).join(", ")}</b>: 이 능력을 쓰면서 싫어하는 부분은 덜한 길을 함께 찾아보기`);
  if(quad.try.length){ const k = S.answers.q7?.keep; talk.push(`키워볼 후보 <b>${quad.try.map(v=>VERB[v].name).join(", ")}</b>: 한 학기 실험으로 늘 수 있는지 확인하기${k?` (Q7에서 계속 하고 싶은지: ${esc(k)})`:""}`); }
  if(!quad.main.length) talk.push(`좋아하고 잘하는 행동이 아직 없음: 답한 질문이 부족했는지, 스스로를 낮게 평가했는지 확인하기`);
  if(!known.length && !emerging.length) talk.push(`맞는 분야가 나오지 않음: 질문을 더 답하거나 덜어내기에서 너무 많이 뺐는지 확인하기`);
  return `<section class="sheet">
      <div class="row between"><h2>지금의 가설</h2><span class="small muted">본인 평가 기준 · 데이터 ${DATA_VERSION}</span></div>
      <p class="muted">이 결과는 확정된 유형이 아니라 앞으로 확인해 볼 가설이야. 선생님과 함께 읽어 봐.</p>
      <div class="matrix">
        <div class="axis-y">좋아함 ↑</div>
        <div class="cell c-try"><h4>키워볼 후보</h4><p>좋아하지만 아직 잘한다고 남기지 않은 행동. 실험해 보고, 늘지 않으면 취미로.</p>${chips(quad.try)}</div>
        <div class="cell c-main"><h4>주력 행동</h4><p>두 번 다 남긴 행동. 진로 탐색의 중심.</p>${chips(quad.main)}</div>
        <div class="cell c-rest"><h4>지금은 내려놓기</h4><p>두 번 다 덜어낸 행동.</p>${chips(quad.rest)}</div>
        <div class="cell c-hidden"><h4>숨은 재능</h4><p>잘하지만 좋아한다고 남기지 않은 행동. 이 능력을 다른 곳에 쓸 길을 찾기.</p>${chips(quad.hidden)}</div>
        <div class="axis-x">잘함 →</div>
      </div>
      ${drainVerbs.length?`<p class="warnbox"><b>${drainVerbs.map(v=>VERB[v].name).join(", ")}</b>은(는) Q6에서 하고 나면 지친다고 한 일에서 나온 행동이야. 이 행동이 매일의 중심이 되는 길은 조심해서 보자.</p>`:""}
    </section>
    ${subjSection}
    <section class="sheet">
      <h2>내가 고른 분야, 행동이 가리키는 분야</h2>
      ${selfMsg}
      ${TI.labels.length?`<p>즐겨 보는 주제: <b>${TI.labels.map(esc).join(", ")}</b>. 행동과 함께 분야를 고를 때 조금 반영했어.</p>`:""}
    </section>
    <section class="sheet">
      <h2>살펴볼 전공·분야</h2>
      <p class="muted">네가 남긴 행동이 2개 이상 겹치는 분야만, 종류마다 가장 잘 맞는 1순위를 보여주고, 2순위는 1순위와 비슷하게 잘 맞을 때만 보여줘. 유망한지는 순서에 반영하지 않았어. 분야 예측은 틀릴 수 있지만 네가 잘하는 행동은 다른 분야로도 옮겨 갈 수 있어.</p>
      <h3>지금 잘 알려진 분야</h3>
      ${known.length?known.map(fieldCard).join(""):`<p class="muted">행동이 2개 이상 겹치는 분야가 아직 없어. 질문을 더 답해 보거나 덜어내기를 다시 해 봐.</p>`}
      <h3>점점 떠오르는 분야</h3>
      ${emerging.length?emerging.map(fieldCard).join(""):`<p class="muted">행동이 2개 이상 겹치는 분야가 아직 없어.</p>`}
    </section>
    ${check}
    ${ratingSection()}
    ${exportSection()}
    <section class="teacher">
      <div class="row between"><h3>선생님과 함께 볼 요약</h3><span class="label">${esc(S.grade||"학년 미입력")}</span></div>
      <dl class="kv">
        <dt>답한 질문</dt><dd>${QUESTIONS.filter(done).length}/${QUESTIONS.length}${QUESTIONS.filter(x=>!done(x)).length?` · 건너뜀: ${QUESTIONS.filter(x=>!done(x)).map(x=>esc(x.tag)).join(", ")}`:""}</dd>
        <dt>주력</dt><dd>${quad.main.map(v=>esc(VERB[v].name)).join(", ")||"없음"}</dd>
        <dt>키워볼 후보</dt><dd>${quad.try.map(v=>esc(VERB[v].name)).join(", ")||"없음"}</dd>
        <dt>숨은 재능</dt><dd>${quad.hidden.map(v=>esc(VERB[v].name)).join(", ")||"없음"}</dd>
        ${(()=>{ const m=QUESTIONS.map(x=>S.answers[x.id]).filter(a=>a&&a.motive!=null&&!a.rest).map(a=>MOTIVES[a.motive]); return m.length?`<dt>찾아본 이유</dt><dd>${m.map(x=>`${esc(x[1])} (${esc(x[0])})`).join(", ")}</dd>`:""; })()}
        <dt>지치는 행동</dt><dd>${drainVerbs.map(v=>esc(VERB[v].name)).join(", ")||"없음"}</dd>
        ${(()=>{ const a=S.answers.q6; if(!a||!a.opts?.length) return ""; const o=optSet("q6").opts; const why=a.opts.map(i=>o[i]).filter(x=>x&&!x[1].length).map(x=>x[0]); return why.length?`<dt>지치는 이유</dt><dd>${why.map(esc).join(", ")}</dd>`:""; })()}
        <dt>가장 끌린 분야</dt><dd>${esc(iName(topNames))||"없음"}</dd>
        <dt>체크한 분야</dt><dd>${S.interests.length}개 · ${esc(iName(S.interests))||"없음"}</dd>
        <dt>살펴볼 분야</dt><dd>${[...known,...emerging].map(x=>esc(x.f.name)).join(" · ")||"없음"}</dd>
        ${(()=>{ const t=Object.entries(S.subjParts||{}).filter(([k,v])=>v.length).map(([k,v])=>`${k}: ${v.map(id=>PART[id].name).join(", ")}`); const d=Object.entries(S.subjPartsOk||{}).filter(([k,v])=>v.length).map(([k,v])=>`${k}: ${v.map(id=>PART[id].name).join(", ")}`);
          return (t.length?`<dt>좋은 세부</dt><dd>${esc(t.join(" / "))}</dd>`:"")+(d.length?`<dt>싫지만 괜찮은 부분</dt><dd>${esc(d.join(" / "))}</dd>`:""); })()}
        <dt>좋아하는 과목</dt><dd>${SL.join(", ")||"없음"}</dd>
        <dt>싫어하는 과목</dt><dd>${SD.join(", ")||"없음"}</dd>
        <dt>성적 잘 나옴</dt><dd>${SG.join(", ")||"없음"}</dd>
        <dt>처음 희망</dt><dd>${esc(S.hope||"적지 않음")}</dd>
      </dl>
      ${TI.genres.length?`<div><span class="label">좋아하는 장르</span><p class="small">${TI.genres.map(esc).join(" · ")} <span class="muted">(취향이라 성향을 단정하지 말고 대화 재료로만)</span></p></div>`:""}
      ${TI.rests.length?`<div><span class="label">쉬려고 한다고 한 활동</span><p class="small">${TI.rests.map(esc).join(" · ")}</p></div>`:""}
      ${others.length?`<div><span class="label">남기지 않은 다른 경험</span><ul>${others.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>`:""}
      ${talk.length?`<div><span class="label">대화 포인트</span><ul>${talk.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}
    </section>
    <div class="row between"><button data-act="backGood">덜어내기 다시 하기</button><button data-act="reset">처음부터 다시</button></div>`;
}

function render(){
  const app = document.getElementById("app");
  const views = {intro:viewIntro, q:viewQ, subj:viewSubj, me:viewMe, self:viewSelf, like:viewLike, good:viewGood, result:viewResult, teacher:viewTeacher};
  if(!views[S.step]) S.step = "intro";
  app.innerHTML = `<header class="top"><div class="brand"><b>MBMI</b><span class="small muted">경험에서 찾는 나의 전공</span></div>${S.step==="teacher"?"":rail()}${isOwnerView&&S.step!=="teacher"?`<button class="ghost small" data-act="openTeacher">선생님 화면</button>`:""}</header>
    ${views[S.step]()}
    <footer>답하는 동안의 내용은 이 기기에만 임시 저장돼. 공용 기기라면 마지막에 '처음부터 다시'를 눌러줘.<br>MBMI · 진로 탐색 연구용</footer>`;
  updateNav();
}

/* ===================== 이벤트 ===================== */
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.bind){ S[t.dataset.bind] = t.value; save(); }
  if(t.dataset.mtext){ ans(t.dataset.mtext).momentText = t.value; save(); }
  if(t.dataset.free){ ans(t.dataset.free).freeText = t.value; save(); }
  if(t.dataset.item){
    const [qid,i] = t.dataset.item.split(":"); const a = ans(qid);
    const idx = () => { const f=filled(a); return f.length===1? f[0] : (a.chosen!=null && f.includes(a.chosen)? a.chosen : null); };
    const before = idx();
    a.items[Number(i)] = t.value;
    if(a.chosen!=null && !a.items[a.chosen].trim()) a.chosen = null;
    if(before!==null && idx()!==before){ resetPick(a); } // 남긴 경험이 다른 칸으로 바뀌면 행동 초기화
    save();
    // 입력칸은 그대로 두고(한글 조합 보호) 아래 영역만 갱신
    const q = Q[qid];
    const cb = document.getElementById("chooseBox"); if(cb) cb.innerHTML = chooseHTML(q,a);
    const pb = document.getElementById("pickBox"); const html = pickHTML(q,a);
    if(pb){ const key = String(idx())+(html?"1":"0")+(activityOf(qid)?.id||"")+(a.actOv||""); if(pb.dataset.last !== key){ pb.innerHTML = html; pb.dataset.last = key; }
      else { const box = pb.querySelector(".myanswer p"); if(box) box.textContent = chosenText(qid); } }
    updateNav();
  }
});
document.addEventListener("change", e=>{ const t=e.target; if(t.dataset.bind){ S[t.dataset.bind]=t.value; save(); } });
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  const go = step=>{ S.step = step; aiMsg=""; save(); render(); window.scrollTo(0,0); };
  const cur = () => ans(QUESTIONS[S.qi].id);
  const reKeep = ()=>{ const col=collected(), mx=keepMax(Object.keys(col).length); S.keepLike=S.keepLike.filter(v=>col[v]).slice(0,mx); S.keepGood=S.keepGood.filter(v=>col[v]).slice(0,mx); };
  switch(act){
    case "start": if(!introReady()) return; S._ex=false; go("q"); break;
    case "interest": { const i=b.dataset.i; if(S.interests.includes(i)){ S.interests=S.interests.filter(x=>x!==i); S.interestTop=S.interestTop.filter(x=>x!==i); } else S.interests=[...S.interests,i];
      if(S.interests.length<=2) S.interestTop=[]; save(); render(); break; }
    case "itop": { const i=b.dataset.i; S.interestTop = S.interestTop.includes(i)? S.interestTop.filter(x=>x!==i) : (S.interestTop.length<2?[...S.interestTop,i]:S.interestTop); save(); render(); break; }
    case "toggleEx": S._ex=!S._ex; render(); break;
    case "alt": { const a=cur(); a.alt=!a.alt; save(); render(); break; }
    case "keep": { cur().keep = b.dataset.k; save(); render(); break; }
    case "pick": { const a=cur(), v=b.dataset.v;
      if(a.picks.includes(v)){ a.picks=a.picks.filter(x=>x!==v); }
      else if(a.picks.length<3) a.picks=[...a.picks,v];
      save(); render(); break; }
    case "opt": { const q=QUESTIONS[S.qi], a=cur(), i=Number(b.dataset.i);
      a.opts = a.opts.includes(i)? a.opts.filter(x=>x!==i) : (a.opts.length<2?[...a.opts,i]:a.opts);
      if(!a.opts.length) a.topics=[]; syncPicks(q.id); save(); render(); break; }
    case "rest": { const a=cur(); a.rest=!a.rest; if(a.rest){ a.opts=[]; a.picks=[]; a.topics=[]; a.custom=false; } save(); render(); break; }
    case "motive": { const a=cur(); const i=Number(b.dataset.i); a.motive = a.motive===i? null : i; save(); render(); break; }
    case "topic": { const a=cur(); const i=Number(b.dataset.i);
      a.topics = a.topics.includes(i)? a.topics.filter(t=>t!==i) : (a.topics.length<2?[...a.topics,i]:a.topics); save(); render(); break; }
    case "notAct": { const a=cur(); a.actOv="none"; a.opts=[]; a.topics=[]; a.rest=false; syncPicks(QUESTIONS[S.qi].id); save(); render(); break; }
    case "undoNotAct": { const a=cur(); a.actOv=null; a.opts=[]; a.topics=[]; syncPicks(QUESTIONS[S.qi].id); save(); render(); break; }
    case "custom": { const a=cur(); a.custom=true; a.rest=false; save(); render(); break; }
    case "uncustom": { const a=cur(); a.custom=false; a.why={}; a.turns=[]; syncPicks(QUESTIONS[S.qi].id); save(); render(); break; }
    case "choose": { const a=cur(); const i=Number(b.dataset.i); if(a.chosen!==i){ a.chosen=i; resetPick(a); aiMsg=""; } save(); render(); break; }
    case "ai": runAI(QUESTIONS[S.qi].id); break;
    case "sendTurn": { const q=QUESTIONS[S.qi]; const ta=document.getElementById("turn-"+q.id); const v=(ta?.value||"").trim(); if(!v) return;
      const a=ans(q.id); a.turns[a.turns.length-1].a=v; save(); runAI(q.id); break; }
    case "prevQ": S.qi=Math.max(0,S.qi-1); S._ex=false; aiMsg=""; save(); render(); window.scrollTo(0,0); break;
    case "gotoQ": S.qi=Number(b.dataset.i); S._ex=false; aiMsg=""; save(); render(); window.scrollTo(0,0); break;
    case "nextQ": S.qi=Math.min(QUESTIONS.length-1,S.qi+1); S._ex=false; aiMsg=""; save(); render(); window.scrollTo(0,0); break;
    case "toSelf": reKeep(); go("subj"); break;
    case "backQ": go("q"); break;
    case "subj": { const k=b.dataset.k; S.subj[k]=b.dataset.v; S.subjParts||={}; S.subjPartsOk||={};
      if(b.dataset.v!=="dislike") delete S.subjPartsOk[k]; if(b.dataset.v==="dislike" && !S.subjGood.includes(k)) delete S.subjParts[k]; save(); render(); break; }
    case "part": { const k=b.dataset.k, key=b.dataset.key, id=b.dataset.p; S[key] ||= {}; const cur=S[key][k]||[];
      S[key][k] = cur.includes(id)? cur.filter(x=>x!==id) : (cur.length<2?[...cur,id]:cur); save(); render(); break; }
    case "subjGood": { const k=b.dataset.k; S.subjGood = S.subjGood.includes(k)? S.subjGood.filter(x=>x!==k) : [...S.subjGood,k]; save(); render(); break; }
    case "toSelfFam": go("self"); break;
    case "backSubj": go("subj"); break;
    case "selfFam": { const f=b.dataset.f; S.selfFam = S.selfFam.includes(f)? S.selfFam.filter(x=>x!==f) : (S.selfFam.length<2?[...S.selfFam,f]:S.selfFam); save(); render(); break; }
    case "toLike": go("like"); break;
    case "backSelf": go("self"); break;
    case "funnel": { const k=b.dataset.key, v=b.dataset.v, max=keepMax(Object.keys(collected()).length);
      S[k] = S[k].includes(v)? S[k].filter(x=>x!==v) : (S[k].length<max?[...S[k],v]:S[k]); save(); render(); break; }
    case "toGood": go("good"); break;
    case "backLike": go("like"); break;
    case "toResult": go(isAdult()?"me":"result"); break;
    case "meDone": go("result"); break;
    case "role": S.role=b.dataset.v; save(); render(); break;
    case "actual": { const f=b.dataset.f; if(f==="none") S.actualFields = S.actualFields.includes("none")?[]:["none"];
      else { S.actualFields=S.actualFields.filter(x=>x!=="none"); S.actualFields = S.actualFields.includes(f)? S.actualFields.filter(x=>x!==f) : (S.actualFields.length<2?[...S.actualFields,f]:S.actualFields); } save(); render(); break; }
    case "sat": S.satisfaction=Number(b.dataset.v); save(); render(); break;
    case "same": S.sameAgain=b.dataset.v; save(); render(); break;
    case "backGood": go("good"); break;
    case "backMe": go("me"); break;
    case "hopeV": { const v=b.dataset.v; S.hopeVerbs = S.hopeVerbs.includes(v)? S.hopeVerbs.filter(x=>x!==v) : (S.hopeVerbs.length<3?[...S.hopeVerbs,v]:S.hopeVerbs); save(); render(); break; }
    case "consent": S.consent = !!b.checked; save(); render(); break;
    case "score": S.score=Number(b.dataset.v); save(); render(); break;
    case "frate": { const f=b.dataset.f, v=Number(b.dataset.v); if(S.fieldRatings[f]===v) delete S.fieldRatings[f]; else S.fieldRatings[f]=v; save(); render(); break; }
    case "submit": submitRun(); break;
    case "toggleCode": S._showCode=!S._showCode; render(); break;
    case "copyCode": { const ta=document.getElementById("runCode"); const msg=document.getElementById("copyMsg");
      navigator.clipboard?.writeText(sendState.code).then(()=>{ if(msg) msg.textContent="복사했어."; }).catch(()=>{ S._showCode=true; render(); const t2=document.getElementById("runCode"); if(t2){ t2.focus(); t2.select(); } const m2=document.getElementById("copyMsg"); if(m2) m2.textContent="복사가 안 돼서 코드를 펼쳤어. 길게 눌러 복사해줘."; }); break; }
    case "openTeacher": S._prev=S.step; S.step="teacher"; render(); window.scrollTo(0,0); loadRuns(); break;
    case "closeTeacher": S.step=S._prev&&S._prev!=="teacher"?S._prev:"intro"; save(); render(); window.scrollTo(0,0); break;
    case "reload": loadRuns(); break;
    case "openRun": { const i=Number(b.dataset.i); T.open = T.open===i? null : i; T.confirmDel=null; render(); break; }
    case "askDel": T.confirmDel=Number(b.dataset.i); render(); break;
    case "cancelDel": T.confirmDel=null; render(); break;
    case "delRun": deleteRun(T.runs[Number(b.dataset.i)]); break;
    case "import": importCodes(document.getElementById("importBox")?.value||""); break;
    case "csv": downloads?.save({filename:`MBMI-results-${new Date().toISOString().slice(0,10)}.csv`, data:toCSV(T.runs)}).catch(()=>{}); break;
    case "exportHtml": { S.runId ||= newId(); save(); const r=buildPayload(); saveFile(fileName(r,"html"), reportHTML(r)); break; }
    case "exportText": { S.runId ||= newId(); save(); const txt=reportText(buildPayload()); const n=document.getElementById("exportNote");
      navigator.clipboard?.writeText(txt).then(()=>{ exportMsg="복사했어. 메모장이나 카톡에 붙여 넣으면 돼."; if(n) n.textContent=exportMsg; }).catch(()=>{ exportMsg="복사가 안 돼. '결과 파일로 저장'을 써줘."; if(n) n.textContent=exportMsg; }); break; }
    case "runHtml": { const r=T.runs[Number(b.dataset.i)]; if(r) downloads?.save({filename:fileName(r,"html"), data:reportHTML(r)}).catch(()=>{}); break; }
    case "runText": { const r=T.runs[Number(b.dataset.i)]; if(r) navigator.clipboard?.writeText(reportText(r)).catch(()=>{}); break; }
    case "json": downloads?.save({filename:`MBMI-backup-${new Date().toISOString().slice(0,10)}.json`, data:JSON.stringify(T.runs.map(({_src,_doc,...r})=>r),null,2)}).catch(()=>{}); break;
    case "reset":
      if(b.dataset.confirm){ S = blank(); sendState={status:"",code:""}; save(); render(); window.scrollTo(0,0); }
      else { b.dataset.confirm="1"; b.textContent="한 번 더 누르면 모두 지워져"; }
      break;
  }
});
render();

</script>
